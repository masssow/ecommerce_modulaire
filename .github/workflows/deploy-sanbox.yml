name: Deploy to Sandbox

on:
  push:
    branches: ["developpement"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 (pour build npm)
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build Frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      # Charger la clé dans un agent SSH (évite l'erreur libcrypto)
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Déploiement par rsync (on n’écrase pas .env.local)
      - name: Rsync to Hostinger
        run: |
          rsync -avz --delete \
            --exclude=".git" --exclude=".github" \
            --exclude="node_modules" --exclude="tests" \
            --exclude="var/cache/*" --exclude=".env*" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SANDBOX_PATH }}

      # Post-deploy : Composer (PHP 8.2), migrations, cache
      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP="${{ secrets.SANDBOX_PATH }}"
            PHP="/opt/alt/php82/usr/bin/php"
            COMPOSER="$PHP /usr/bin/composer"

            cd "$APP"
            $COMPOSER install --no-interaction --prefer-dist
            $PHP bin/console doctrine:migrations:migrate --no-interaction --env=dev
            $PHP bin/console cache:clear --env=dev
            $PHP bin/console cache:warmup --env=dev

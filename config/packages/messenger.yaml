framework:
  messenger:
    transports:
      sync: 'sync://'
      async:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options: { table_name: messenger_messages }
      failed:
        dsn: 'doctrine://default?queue_name=failed'
        options: { table_name: messenger_messages }

    routing:
      App\Message\Email\SendOrderEmail: sync

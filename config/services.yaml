# config/services.yaml

parameters:
  # Garde/complète tes paramètres si tu les utilises ailleurs (Twig, etc.)
  # stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
  # stripe_currency: 'EUR'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Découverte automatique de tout le code de src/
  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  # ✅ Client Stripe injecté proprement dans les services (pas de setApiKey global)
  Stripe\StripeClient:
    arguments:
        $config:
            api_key: '%env(STRIPE_SECRET_KEY)%'

  # === Tes services existants déclarés publics (si besoin dans des contrôleurs ou templates) ===
  App\Services\AdressManager:
    public: true

  App\Services\UserProfileService:
    public: true

  # === (Optionnel) Tu peux rendre publics ces services si tu veux les appeler depuis des contrôleurs manuellement ===
  # App\Service\Checkout\CheckoutConfirmationService:
  #   public: true
  # App\Service\Checkout\CartClearer:
  #   public: true
  # App\Service\Checkout\MoneyFormatter:
  #   public: true

  # ❌ Supprimé: l’injection manuelle d’arguments sur CheckoutController
  # Elle n’est plus nécessaire et peut casser si la signature a changé.
  # App\Controller\CheckoutController:
  #   arguments:
  #     $stripePublicKey: '%stripe_public_key%'
  #     $stripeCurrency: '%stripe_currency%'

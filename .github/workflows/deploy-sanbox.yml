name: Deploy to Sandbox

on:
  push:
    branches: ["developpement"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Si tes secrets sont dans un Environment, dé-commente la ligne suivante
    # environment: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Écrit la clé privée depuis SSH_PRIVATE_KEY_B64 (recommandé) ou SSH_PRIVATE_KEY (plain OpenSSH)
      - name: Write SSH key (B64 or plain) + verify
        shell: bash
        env:
          PK_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          PK_PLAIN: ${{ secrets.SSH_PRIVATE_KEY }}
          PK_PASS: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${PK_B64:-}" ]; then
            echo "$PK_B64" | base64 -d > ~/.ssh/id_ci
            SRC="SSH_PRIVATE_KEY_B64"
          elif [ -n "${PK_PLAIN:-}" ]; then
            # Normalise CRLF et force un \n final
            printf "%s\n" "$PK_PLAIN" | sed 's/\r$//' > ~/.ssh/id_ci
            SRC="SSH_PRIVATE_KEY"
          else
            echo "::error::Neither SSH_PRIVATE_KEY_B64 nor SSH_PRIVATE_KEY is set (check repo/environ secrets)."
            exit 1
          fi

          chmod 600 ~/.ssh/id_ci
          echo "Private key bytes: $(wc -c < ~/.ssh/id_ci) (source: $SRC)"

          # Vérifie l'entête (doit être OpenSSH ou RSA PEM)
          FIRST_LINE="$(head -n1 ~/.ssh/id_ci || true)"
          case "$FIRST_LINE" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"|"-----BEGIN RSA PRIVATE KEY-----") ;;
            *)
              echo "::error::Unexpected key header: '$FIRST_LINE'. Provide an OpenSSH private key (not .ppk)."
              exit 1
              ;;
          esac

          # Vérifie qu'on peut dériver la clé publique (si passphrase, la lire via PK_PASS)
          if [ -n "${PK_PASS:-}" ]; then
            PUB="$(ssh-keygen -y -P "$PK_PASS" -f ~/.ssh/id_ci)"
          else
            PUB="$(ssh-keygen -y -f ~/.ssh/id_ci)"
          fi
          printf "%s\n" "$PUB" | ssh-keygen -lf -  # affiche l'empreinte (fingerprint)

      - name: SSH sanity
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ci -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo OK-from-CI"

      # Génère le script de déploiement à exécuter côté serveur
      - name: Create remote deploy script
        shell: bash
        env:
          APP: ${{ secrets.SANDBOX_PATH }}
        run: |
          cat > deploy-sandbox.sh <<'SH'
          set -euo pipefail

          APP="__APP__"
          PHP="/opt/alt/php82/usr/bin/php"
          COMPOSER="$PHP /usr/bin/composer"

          echo "[1/6] Code → ${APP}"
          cd "$APP"
          if [ -d .git ]; then
            git fetch origin --prune
            git reset --hard origin/developpement
          else
            echo "⚠️  Pas de dépôt Git dans $APP (skip fetch/reset)"
          fi

          echo "[2/6] Composer install"
          $COMPOSER install --no-interaction --prefer-dist

          echo "[3/6] Node 20 via nvm + npm install/build"
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          fi
          . "$NVM_DIR/nvm.sh"
          nvm install 20
          nvm use 20
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
          if [ -f package.json ]; then npm run build; fi

          echo "[4/6] Doctrine migrations (dev)"
          $PHP bin/console doctrine:migrations:migrate --no-interaction --env=dev

          echo "[5/6] Cache clear + warmup (dev)"
          $PHP bin/console cache:clear --env=dev
          $PHP bin/console cache:warmup --env=dev

          echo "[6/6] Done."
          SH
          sed -i "s|__APP__|$APP|g" deploy-sandbox.sh
          chmod +x deploy-sandbox.sh

      - name: Upload deploy script
        shell: bash
        run: |
          scp -i ~/.ssh/id_ci -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ./deploy-sandbox.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy-sandbox.sh

      - name: Run remote deploy script
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ci -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash /tmp/deploy-sandbox.sh && rm -f /tmp/deploy-sandbox.sh"

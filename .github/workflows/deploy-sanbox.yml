name: Deploy to Sandbox

on:
  push:
    branches: ["developpement"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node 20 (build npm côté GitHub)
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build Frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      # 3) Écrire la clé privée depuis le secret (pas d'agent)
      - name: Write SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          # supprime d'éventuels CRLF (Windows) avant d'écrire la clé
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci

      # 4) Test SSH rapide (facultatif)
      - name: SSH sanity
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ci -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo OK-from-CI"

      # 5) Rsync vers Hostinger (on n’écrase pas .env.local, ni vendor)
      - name: Rsync to Hostinger (sandbox)
        shell: bash
        run: |
          rsync -avz --delete \
            --exclude=".git" --exclude=".github" \
            --exclude="node_modules" --exclude="tests" \
            --exclude="vendor" --exclude="var/cache/*" \
            --exclude=".env*" \
            -e "ssh -i ~/.ssh/id_ci -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./  ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SANDBOX_PATH }}

      # 6) Post-deploy : Composer (PHP 8.2), migrations, cache (via ssh -i)
      - name: Post-deploy commands
        shell: bash
        env:
          APP: ${{ secrets.SANDBOX_PATH }}
        run: |
          ssh -i ~/.ssh/id_ci -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
              set -e
              PHP='/opt/alt/php82/usr/bin/php'
              COMPOSER=\"\$PHP /usr/bin/composer\"
              cd \"$APP\"
              \$COMPOSER install --no-interaction --prefer-dist
              \$PHP bin/console doctrine:migrations:migrate --no-interaction --env=dev
              \$PHP bin/console cache:clear --env=dev
              \$PHP bin/console cache:warmup --env=dev
            "
